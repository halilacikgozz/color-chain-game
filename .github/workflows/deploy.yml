name: Build and publish Color Chain
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Import project
        run: godot --headless --editor --path . --import
      - name: Test game rules
        run: timeout 30s godot --headless --path . --script tests/test_game.gd
      - name: Verify competition replay
        run: node --experimental-strip-types tests/test_replay.ts
      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web "build/web/game-${GITHUB_SHA}.html"
          cp "build/web/game-${GITHUB_SHA}.html" build/web/index.html
          test -s build/web/index.html
          test -s "build/web/game-${GITHUB_SHA}.wasm"
          test -s "build/web/game-${GITHUB_SHA}.pck"
          touch build/web/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: build/web
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
