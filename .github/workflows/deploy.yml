name: Build and publish Color Chain
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Stamp installed app version
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          code = int(os.environ['GITHUB_RUN_NUMBER'])
          Path('build_info.json').write_text(json.dumps({'version_code':code,'version_name':'1.0.'+str(code)}))
          PYTHON
      - name: Import project
        run: godot --headless --editor --path . --import
      - name: Test number game and save migration
        run: timeout 30s godot --headless --path . --script tests/test_numbers.gd
      - name: Test growing number chains
        run: timeout 30s godot --headless --path . --script tests/test_ladder.gd
      - name: Test app updates over HTTP
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory tests/fixtures > /tmp/update-fixture.log 2>&1 &
          UPDATE_SERVER_PID=$!
          trap 'kill "$UPDATE_SERVER_PID"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --silent --fail http://127.0.0.1:8765/update.json > /dev/null; then break; fi
            sleep 1
          done
          timeout 30s godot --headless --path . --script tests/test_updates.gd
      - name: Export web build
        run: |
          mkdir -p build/web
          touch build/.gdignore
          godot --headless --path . --export-release Web "build/web/game-${GITHUB_SHA}.html"
          cp "build/web/game-${GITHUB_SHA}.html" build/web/index.html
          test -s build/web/index.html
          test -s "build/web/game-${GITHUB_SHA}.wasm"
          test -s "build/web/game-${GITHUB_SHA}.pck"
          touch build/web/.nojekyll
          cp privacy.html build/web/privacy.html
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/color-chain-signing
          key: color-chain-personal-apk-signing-v1
      - name: Prepare Android export
        run: |
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          mkdir -p "$HOME/.local/share/color-chain-signing" "$HOME/.config/godot"
          APK_KEY="$HOME/.local/share/color-chain-signing/personal.keystore"
          if [ ! -f "$APK_KEY" ]; then
            echo "Existing Android signing key is unavailable. Refusing to replace it and break installed app updates."
            exit 1
          fi
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          settings = Path.home()/'.config/godot/editor_settings-4.4.tres'
          settings.write_text('[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "'+os.environ['ANDROID_HOME']+'"\nexport/android/java_sdk_path = "'+os.environ['JAVA_HOME']+'"\n')
          preset = Path('export_presets.cfg')
          preset.write_text(preset.read_text().replace('version/code=1', 'version/code='+os.environ['GITHUB_RUN_NUMBER']).replace('version/name="1.0"', 'version/name="1.0.'+os.environ['GITHUB_RUN_NUMBER']+'"'))
          PYTHON
      - name: Export and verify installable APK
        run: |
          mkdir -p build/android build/web/downloads
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$HOME/.local/share/color-chain-signing/personal.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android
          godot --headless --path . --export-release Android build/android/color-chain.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose build/android/color-chain.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging build/android/color-chain.apk > build/android/apk-info.txt
          python3 - <<'PYTHON'
          from pathlib import Path
          import zipfile, os
          info = Path('build/android/apk-info.txt').read_text()
          assert "name='com.halilacikgozz.colorchain'" in info
          assert "android.permission.INTERNET" in info
          assert "versionCode='"+os.environ['GITHUB_RUN_NUMBER']+"'" in info
          assert "versionName='1.0."+os.environ['GITHUB_RUN_NUMBER']+"'" in info
          with zipfile.ZipFile('build/android/color-chain.apk') as apk:
              files = apk.namelist()
              assert 'lib/arm64-v8a/libgodot_android.so' in files
              assert 'lib/armeabi-v7a/libgodot_android.so' in files
              assert any(name.startswith('assets/') for name in files)
          print(info)
          PYTHON
          python3 - <<'PYTHON'
          import urllib.request, time
          url = 'https://halilacikgozz.github.io/color-chain-game/downloads/color-chain.apk?t='+str(int(time.time()))
          urllib.request.urlretrieve(url,'build/android/previous.apk')
          PYTHON
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs build/android/previous.apk > build/android/previous-cert.txt
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs build/android/color-chain.apk > build/android/current-cert.txt
          python3 - <<'PYTHON'
          from pathlib import Path
          import re
          pattern = r'Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]+)'
          old = re.search(pattern,Path('build/android/previous-cert.txt').read_text())
          new = re.search(pattern,Path('build/android/current-cert.txt').read_text())
          assert old and new and old.group(1).lower() == new.group(1).lower(), 'Signing certificate changed; refuse to publish incompatible update'
          Path('build/android/previous.apk').unlink()
          print('Existing APK signing certificate matches: in-place update remains compatible')
          PYTHON
          cp build/android/color-chain.apk build/web/downloads/color-chain.apk
          sha256sum build/android/color-chain.apk > build/android/SHA256SUMS.txt
          cp assets/icon.svg build/web/downloads/icon.svg
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          page = Path('android-install.html').read_text().replace('{{VERSION}}','1.0.'+os.environ['GITHUB_RUN_NUMBER']).replace('{{APK_SIZE}}',str(round(Path('build/android/color-chain.apk').stat().st_size/1048576,1)))
          Path('build/web/android.html').write_text(page)
          import json, hashlib
          code = int(os.environ['GITHUB_RUN_NUMBER'])
          info = json.loads(Path('build_info.json').read_text())
          notes = json.loads(Path('release_notes.json').read_text())
          apk = Path('build/web/downloads/color-chain.apk')
          manifest = {'schema':1,'package_id':'com.halilacikgozz.colorchain',**info,
            'download_url':'https://halilacikgozz.github.io/color-chain-game/downloads/color-chain.apk',
            'apk_sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'apk_size':apk.stat().st_size,'notes':notes}
          assert info['version_code'] == code and info['version_name'] == '1.0.'+str(code)
          assert len(notes) <= 5 and all(isinstance(note,str) and len(note) <= 180 and '\n' not in note for note in notes)
          Path('build/web/update.json').write_text(json.dumps(manifest,ensure_ascii=False))
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: color-chain-android
          path: build/android/
          retention-days: 90
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: build/web
  play_bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/color-chain-signing
          key: color-chain-personal-apk-signing-v1
      - name: Prepare Play build
        run: |
          sdkmanager "platform-tools" "build-tools;36.1.0" "platforms;android-36" "ndk;29.0.14206865"
          mkdir -p "$HOME/.config/godot" build/play
          touch build/.gdignore
          test -f "$HOME/.local/share/color-chain-signing/personal.keystore"
          python3 - <<'PYTHON'
          import os, json
          from pathlib import Path
          code = int(os.environ['GITHUB_RUN_NUMBER'])
          Path('build_info.json').write_text(json.dumps({'version_code':code,'version_name':'1.0.'+str(code),'distribution':'google_play'}))
          p = Path('export_presets.cfg')
          p.write_text(p.read_text().replace('version/code=1','version/code='+str(code)).replace('version/name="1.0"','version/name="1.0.'+str(code)+'"'))
          settings = Path.home()/'.config/godot/editor_settings-4.7.tres'
          settings.write_text('[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "'+os.environ['ANDROID_HOME']+'"\nexport/android/java_sdk_path = "'+os.environ['JAVA_HOME']+'"\n')
          PYTHON
      - name: Test rules on the Play engine
        run: |
          godot --headless --editor --path . --import
          timeout 30s godot --headless --path . --script tests/test_numbers.gd
          timeout 30s godot --headless --path . --script tests/test_ladder.gd
          timeout 30s godot --headless --path . --script tests/test_store.gd
      - name: Export signed Google Play App Bundle
        run: |
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$HOME/.local/share/color-chain-signing/personal.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android
          godot --headless --path . --install-android-build-template --export-release GooglePlay build/play/color-chain.aab
          jarsigner -verify build/play/color-chain.aab
          keytool -printcert -jarfile build/play/color-chain.aab > build/play/upload-certificate.txt
      - name: Validate store bundle and 16 KB support
        run: |
          curl --fail --location --retry 3 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar --output /tmp/bundletool.jar
          python3 tools/verify_play_bundle.py --bundle build/play/color-chain.aab --bundletool /tmp/bundletool.jar --version-code "$GITHUB_RUN_NUMBER" --report build/play/verification.json
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android
          java -jar /tmp/bundletool.jar build-apks --bundle=build/play/color-chain.aab --output=build/play/check.apks --mode=universal --ks="$HOME/.local/share/color-chain-signing/personal.keystore" --ks-key-alias=androiddebugkey --ks-pass=env:GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD --key-pass=env:GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD
          unzip -p build/play/check.apks universal.apk > build/play/universal-test.apk
          "$ANDROID_HOME/build-tools/36.1.0/zipalign" -c -P 16 -v 4 build/play/universal-test.apk > build/play/zip-alignment.txt
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose build/play/universal-test.apk > build/play/apk-signature.txt
          sha256sum build/play/color-chain.aab > build/play/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: color-chain-google-play
          path: |
            build/play/color-chain.aab
            build/play/verification.json
            build/play/verification.manifest.xml
            build/play/upload-certificate.txt
            build/play/zip-alignment.txt
            build/play/apk-signature.txt
            build/play/SHA256SUMS.txt
          retention-days: 90
  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, play_bundle]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
